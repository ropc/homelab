# minecraft
  crafty:
    container_name: crafty-container
    image: registry.gitlab.com/crafty-controller/crafty-4:latest
    restart: always
    environment:
        - TZ=America/New_York
    ports:
        - "8443:8443" # HTTPS
        - "8123:8123" # DYNMAP
        - "19132:19132/udp" # BEDROCK
          #- "25500-25600:25500-25600" # MC SERV PORT RANGE
        - "25565:25565" # JAVA MC DEFAULT PORT
    volumes:
        - ~/minecraft/crafty/backups:/crafty/backups
        - ~/minecraft/crafty/logs:/crafty/logs
        - ~/minecraft/crafty/servers:/crafty/servers
        - ~/minecraft/crafty/config:/crafty/app/config
        - ~/minecraft/crafty/import:/crafty/import
    labels:
      - com.centurylinklabs.watchtower.enable=true

# media
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - JELLYFIN_PublishedServerUrl=http://192.168.1.106 #optional
    volumes:
      - /docker/jellyfin:/config
      - /media/drive/piracy/media/shows:/data/tvshows
      - /media/drive/piracy/media/movies:/data/movies
    ports:
      - 8096:8096
      # - 8920:8920 #optional
      - 7359:7359/udp #optional
      # - 1900:1900/udp #optional
    restart: unless-stopped

# piracy
  jellyseerr:
    image: ghcr.io/fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=America/New_York
      - PORT=5055 #optional
    ports:
      - 5055:5055
    volumes:
      - /docker/jellyseerr:/app/config
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /docker/sonarr:/config
      - /media/drive/piracy:/data
    ports:
      - 8989:8989
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /docker/radarr:/config
      - /media/drive/piracy:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /docker/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    cpus: 1
    # networks:
    #   - local
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=9080
      - TORRENTING_PORT=28469
    volumes:
      - /docker/qbittorrent/config:/config
      - /media/drive/piracy/downloads:/data/downloads
      - /docker/qbittorrent/vuetorrent:/vuetorrent
    ports:
      - 9080:9080
      - 28469:28469
      - 28469:28469/udp
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

# porn
  stash:
    image: stashapp/stash:latest
    container_name: stash
    restart: unless-stopped
    cpus: 2
    ## the container's port must be the same with the STASH_PORT in the environment section
    ports:
      - "9999:9999"
    # networks:
    #   - local
    environment:
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      ## Adjust below to change default port (9999)
      - STASH_PORT=9999
    volumes:
      - /etc/localtime:/etc/localtime:ro
      ## Keep configs, scrapers, and plugins here.
      - /docker/stash/config:/root/.stash
      ## Point this at your collection.
      - /media/drive/porn:/data/drive
      - /home/ropc/porn:/data/ssd:ro
      ## This is where your stash's metadata lives
      - /docker/stash/metadata:/metadata
      ## Any other cache content.
      - /docker/stash/cache:/cache
      ## Where to store binary blob data (scene covers, images)
      - /docker/stash/blobs:/blobs
      ## Where to store generated content (screenshots,previews,transcodes,sprites)
      - /docker/stash/generated:/generated
    labels:
      - com.centurylinklabs.watchtower.enable=true

  qbittorrent-porn:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent-porn
    cpus: 0.5
    # networks:
    #   - local
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8666
      - TORRENTING_PORT=65124
      # - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - /docker/qbittorrent/porn-config:/config
      - /media/drive/porn/torrents:/downloads
      - /docker/qbittorrent/vuetorrent:/vuetorrent
    ports:
      - 8666:8666
      - 65124:65124
      - 65124:65124/udp
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  local:
    name: local-bridge
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: 192.168.1.106
