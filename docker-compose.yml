services:

  # watchtower:
  #   image: containrrr/watchtower
  #   container_name: watchtower
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     # - /root/.docker/config.json:/config.json
  #     - /etc/localtime:/etc/localtime:ro
  #   environment:
  #     - WATCHTOWER_SCHEDULE=0 0 4 * * *
  #     - WATCHTOWER_LABEL_ENABLE=true
  #     - WATCHTOWER_RUN_ONCE=true

  crafty:
    container_name: crafty-container
    image: registry.gitlab.com/crafty-controller/crafty-4:latest
    restart: always
    environment:
        - TZ=Etc/UTC
    ports:
        - "8443:8443" # HTTPS
        - "8123:8123" # DYNMAP
        - "19132:19132/udp" # BEDROCK
          #- "25500-25600:25500-25600" # MC SERV PORT RANGE
        - "25565:25565" # JAVA MC DEFAULT PORT
    volumes:
        - ~/minecraft/crafty/backups:/crafty/backups
        - ~/minecraft/crafty/logs:/crafty/logs
        - ~/minecraft/crafty/servers:/crafty/servers
        - ~/minecraft/crafty/config:/crafty/app/config
        - ~/minecraft/crafty/import:/crafty/import
    labels:
      - com.centurylinklabs.watchtower.enable=true

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /docker/sonarr:/config
      - /media/drive/piracy:/data
        #- /path/to/tvseries:/tv #optional
        #- /path/to/downloadclient-downloads:/downloads #optional
    ports:
      - 8989:8989
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /docker/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - AUTO_UPDATE=true #optional
        #- RUN_OPTS= #optional
    volumes:
      - /docker/jackett:/config
      - /media/drive/piracy:/downloads
    ports:
      - 9117:9117
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  stash:
    image: stashapp/stash:latest
    container_name: stash
    restart: unless-stopped
    ## the container's port must be the same with the STASH_PORT in the environment section
    ports:
      - "9999:9999"
    # networks:
    #   - local
    environment:
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      ## Adjust below to change default port (9999)
      - STASH_PORT=9999
    volumes:
      - /etc/localtime:/etc/localtime:ro
      ## Keep configs, scrapers, and plugins here.
      - /docker/stash/config:/root/.stash
      ## Point this at your collection.
      - /media/drive/porn:/data/drive
      - /home/ropc/porn:/data/ssd:ro
      ## This is where your stash's metadata lives
      - /docker/stash/metadata:/metadata
      ## Any other cache content.
      - /docker/stash/cache:/cache
      ## Where to store binary blob data (scene covers, images)
      - /docker/stash/blobs:/blobs
      ## Where to store generated content (screenshots,previews,transcodes,sprites)
      - /docker/stash/generated:/generated
    labels:
      - com.centurylinklabs.watchtower.enable=true

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent-porn
    cpus: 0.5
    # networks:
    #   - local
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8666
      - TORRENTING_PORT=6881
      # - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - /docker/qbittorrent/porn-config:/config
      - /media/drive/porn/torrents:/downloads
      - /docker/qbittorrent/vuetorrent:/vuetorrent
    ports:
      - 8666:8666
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  local:
    name: local-bridge
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: 192.168.1.106
