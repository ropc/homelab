# pihole
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port
      - "8880:80/tcp"
      # Default HTTPs Port. FTL will generate a self-signed certificate
      - "8443:443/tcp"
      # Uncomment the below if using Pi-hole as your DHCP Server
      #- "67:67/udp"
      # Uncomment the line below if you are using Pi-hole as your NTP server
      #- "123:123/udp"
    environment:
      # Set the appropriate timezone for your location from
      # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones, e.g:
      TZ: 'America/New_York'
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      FTLCONF_webserver_api_password: 'correct horse battery staple'
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'all'
      FTLCONF_dns_listeningMode: 'all'
    # Volumes store your data between container upgrades
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - '/docker/etc-pihole:/etc/pihole'
      # Uncomment the below if you have custom dnsmasq config files that you want to persist. Not needed for most starting fresh with Pi-hole v6. If you're upgrading from v5 you and have used this directory before, you should keep it enabled for the first v6 container start to allow for a complete migration. It can be removed afterwards. Needs environment variable FTLCONF_misc_etc_dnsmasq_d: 'true'
      #- './etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
      # # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      # - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    restart: unless-stopped

# porn
  stash:
    image: stashapp/stash:latest
    container_name: stash
    restart: unless-stopped
    cpu_shares: 256   # default is 1024; smaller = lower priority
    ## the container's port must be the same with the STASH_PORT in the environment section
    ports:
      - "9999:9999"
    # networks:
    #   - local
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
    environment:
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      ## Adjust below to change default port (9999)
      - STASH_PORT=9999
    volumes:
      - /etc/localtime:/etc/localtime:ro
      ## Keep configs, scrapers, and plugins here.
      - /docker/stash/config:/root/.stash
      ## Point this at your collection.
      - /media/extdrive/porn:/data/drive
      ## This is where your stash's metadata lives
      - /docker/stash/metadata:/metadata
      ## Any other cache content.
      - /docker/stash/cache:/cache
      ## Where to store binary blob data (scene covers, images)
      - /docker/stash/blobs:/blobs
      ## Where to store generated content (screenshots,previews,transcodes,sprites)
      - /docker/stash/generated:/generated
    labels:
      - com.centurylinklabs.watchtower.enable=true
    devices:
      - /dev/dri:/dev/dri
    blkio_config:
      weight_device:
      - path: /dev/sdc
        weight: 250  # default 500; lower = lower priority

  qbittorrent-porn:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent-porn
    cpu_shares: 128   # default is 1024; smaller = lower priority
    # networks:
    #   - local
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8666
      - TORRENTING_PORT=65124
      # - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - /docker/qbittorrent/porn-config:/config
      - /media/extdrive/porn/torrents:/downloads
      - /docker/qbittorrent/vuetorrent:/vuetorrent
    ports:
      - 8666:8666
      - 65124:65124
      - 65124:65124/udp
    restart: unless-stopped
    blkio_config:
      weight_device:
      - path: /dev/sdc
        weight: 125  # default 500; lower = lower priority

# watchtower
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # - /root/.docker/config.json:/config.json
      - /etc/localtime:/etc/localtime:ro
    environment:
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_ROLLING_RESTART=true
      # - WATCHTOWER_LABEL_ENABLE=true
      # - WATCHTOWER_RUN_ONCE=true

volumes:
  memebot:
  zwave-config:
    name: zwave-config

networks:
  cf-tunnel:
    name: cf-tunnel
    external: true
  proxied-network:
    name: proxied-network
  recyclarr:
    name: recyclarr
    # external: true
  home-automation:
    name: home-automation

