- name: "update crafty and plugins"
  hosts: myhosts
  tasks:
    - name: get minecraft server dirs
      ansible.builtin.find:
        paths: ["/docker/crafty/servers/"]
        patterns: ["plugins"]
        file_type: directory
        recurse: true
      register: server_plugin_dirs

    - name: get release for ViaVersion, TCPShield
      ansible.builtin.uri:
        url: https://api.github.com/repos/{{ item.user }}/{{ item.repo }}/releases/latest
      loop:
        - { user: ViaVersion, repo: ViaVersion }
        - { user: TCPShield, repo: RealIP }
      register: releases

    - name: create download dir
      ansible.builtin.file:
        path: "/ansible/minecraft_plugins/"
        state: directory
        mode: "0755"

    - name: download/update plugins
      vars:
        viaversion_query: "[?contains(item.repo, 'ViaVersion')] | [0].json.assets[?ends_with(name, '.jar')].browser_download_url | [0]"
        viaversion_url: "{{ releases.results | community.general.json_query(viaversion_query) }}"
        tcpshield_query: "[?contains(item.repo, 'RealIP')] | [0].json.assets[?ends_with(name, '.jar')].browser_download_url | [0]"
        tcpshield_url: "{{ releases.results | community.general.json_query(tcpshield_query) }}"
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "/ansible/minecraft_plugins/{{ item.dest }}"
        mode: "0644"
      loop:
        - { url: "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot", dest: "Geyser.jar" }
        - { url: "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot", dest: "Floodgate.jar" }
        - { url: "{{ viaversion_url }}", dest: "ViaVersion.jar" }
        - { url: "{{ tcpshield_url }}", dest: "TCPShield.jar" }
      register: plugin_downloads

    - name: check if update is needed
      ansible.builtin.meta: end_play
      when: not plugin_downloads.changed

    - name: copy plugins to servers
      ansible.builtin.copy:
        remote_src: true
        src: "/ansible/minecraft_plugins/"
        dest: "{{ item.path }}/"
        mode: "0755"
        owner: ropc
        group: docker
      with_items: "{{ server_plugin_dirs.files }}"

    - name: restart with latest crafty container
      community.docker.docker_compose_v2:
        project_src: /ansible/docker-compose/
        services: ["crafty"]
        pull: always
        state: restarted  # always restart. will probably move off crafty at some point
      register: container
