---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/

- resources:
    label: System
    cpu: true
    memory: true
    cputemp: true
    tempmin: 30 # optional, minimum cpu temp
    tempmax: 90 # optional, maximum cpu temp
    uptime: true
    network: true

- resources:
    label: Storage
    disk:
        - /
        - /media/data
        - /media/internal
