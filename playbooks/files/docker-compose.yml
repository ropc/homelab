# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json

services:
# DNS Sinkhole
  adguardhome:
    image: 'adguard/adguardhome'
    container_name: 'adguardhome'
    pull_policy: daily
    cpu_shares: 2048   # default is 1024; larger = higher priority
    restart: unless-stopped
    networks:
      - adguardhome
    expose:
      - 80  # Web UI
      # - 3980:3000  # setup web ui
    ports:
      - 53:53/tcp # DNS
      - 53:53/udp # DNS
    volumes:
      - /docker/adguardhome/work:/opt/adguardhome/work
      - /docker/adguardhome/conf:/opt/adguardhome/conf

# reverse proxy

  caddy:
    # image: caddy:latest
    build:
      labels: ["custom-caddy:latest"]
      dockerfile: Dockerfile.caddy
    container_name: caddy
    pull_policy: daily
    restart: unless-stopped
    expose:
      - "80"
      - "2019"
    ports:
      - "443:443"
      - "443:443/udp"
    networks:
      - adguardhome
      - immich
      - media
      - homeautomation
      - meme-bot
      - minecraft
      - stash
      - syncthing
      - nextcloud
      - homepage
    volumes:
      - /docker/caddy/conf:/etc/caddy
      - /docker/caddy/site:/srv
      - caddy_data:/data
      - caddy_config:/config

# media
  
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    pull_policy: daily
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      # - JELLYFIN_PublishedServerUrl=http:/jellyfin.local # autodiscovery response domain or IP address
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    volumes:
      - /docker/jellyfin:/config
      - /media/data/piracy/media/shows:/data/tvshows
      - /media/data/piracy/media/movies:/data/movies
    expose:
      - "8096"  # web ui http
      # - 8920:8920 # web ui https
      # - 7359:7359/udp # client discovery
      # - 1900:1900/udp #optional
    restart: unless-stopped
    networks:
      - media
    gpus: all

  # jellyseerr:
  #   image: ghcr.io/fallenbagel/jellyseerr:latest
  #   container_name: jellyseerr
  #   environment:
  #     - LOG_LEVEL=debug
  #     - TZ=America/New_York
  #     - PORT=5055 #optional
  #   ports:
  #     - 5055:5055
  #   volumes:
  #     - /docker/jellyseerr:/app/config
  #   restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    pull_policy: daily
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /docker/sonarr:/config
      - /media/data/piracy:/data
    expose:
      - 8989
    networks:
      - media
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    pull_policy: daily
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /docker/radarr:/config
      - /media/data/piracy:/data
    expose:
      - 7878
    networks:
      - media
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    pull_policy: daily
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /docker/prowlarr:/config
    expose:
      - 9696
    restart: unless-stopped
    networks:
      - media

  # recyclarr:
  #   image: ghcr.io/recyclarr/recyclarr
  #   container_name: recyclarr
  #   # user: 1000:1000
  #   networks:
  #     - recyclarr
  #   volumes:
  #     - ~/.config/recyclarr:/config
  #   environment:
  #     - TZ=America/New_York
  #     - RECYCLARR_CREATE_CONFIG=true

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    pull_policy: daily
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    networks:
      - media
    volumes:
      - /docker/bazarr:/config
      - /media/data/piracy:/data
    expose:
      - 6767
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    pull_policy: daily
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    networks:
      - media
    volumes:
      - /docker/lidarr:/config
      - /media/data/piracy:/data
    expose:
      - 8686
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    pull_policy: daily
    user: 1000:1000 # should be owner of volumes
    expose:
      - 4533
    restart: unless-stopped
    networks:
      - media
    environment:
      # Optional: put your config options customization here. Examples:
      # ND_LOGLEVEL: debug
      ND_REVERSEPROXYWHITELIST: 172.19.0.0/16
      # ND_ENABLETRANSCODINGCONFIG: true
      ND_TRANSCODINGCACHESIZE: 300MB # default is 100MB
    volumes:
      - "/docker/navidrome:/data"
      - "/media/data/music:/music:ro"

  beets-flask:
    image: pspitzner/beets-flask:stable
    container_name: beets-flask
    pull_policy: daily
    restart: unless-stopped
    expose:
      - 5001
    networks:
      - media
    environment:
        # Change to your timezone
        TZ: "America/New_York"
        # 502 is default on macos, 1000 on linux
        USER_ID: 1000
        GROUP_ID: 1000
    volumes:
        - /docker/beets-flask/config:/config
        # for music folders, match paths inside and out of container!
        - /media/data/piracy/media/music:/media/data/piracy/media/music:ro  # inbox/input
        - /media/data/music:/media/data/music  # library
        - /media/data/untagged-music:/media/data/untagged-music  # temp
        # If you want to persist the logs, you can mount a logs directory
        - /docker/beets-flask/logs:/logs

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    pull_policy: daily
    cpu_shares: 256   # default is 1024; smaller = lower priority
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=9080
      - TORRENTING_PORT=28469
    volumes:
      - /docker/qbittorrent/config:/config
      - /media/data/piracy/downloads:/data/downloads
      - /docker/qbittorrent/vuetorrent:/vuetorrent
      - /incomplete-torrents:/incomplete-torrents
    expose:
      - 9080  # web ui
    ports:
      - 28469:28469
      - 28469:28469/udp
    restart: unless-stopped
    networks:
      - media
    # blkio_config:
    #   weight_device:
    #   - path: /dev/sdb
    #     weight: 375  # default 500; lower = lower priority

# home automation
  homeassistant:
    image: lscr.io/linuxserver/homeassistant:latest
    container_name: homeassistant
    pull_policy: daily
    # network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /docker/homeassistant:/config
      - /var/run/dbus:/var/run/dbus:ro
      # - /sys/class/bluetooth/hci0:/sys/class/bluetooth/hci0
    expose:
      - 8123 # web ui
    # devices:
    #   - /dev/serial/by-id/usb-Zooz_800_Z-Wave_Stick_533D004242-if00:/dev/zwave
    restart: unless-stopped
    networks:
      - homeautomation

  zwave-js-ui:
    container_name: zwave-js-ui
    image: zwavejs/zwave-js-ui:latest
    pull_policy: daily
    restart: always
    tty: true
    stop_signal: SIGINT
    environment:
      - SESSION_SECRET=mysupersecretkey
      # Uncomment if you want log times and dates to match your timezone instead of UTC
      # Available at https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=America/New_York
      - TRUST_PROXY=1
    devices:
      # Do not use /dev/ttyUSBX serial devices, as those mappings can change over time.
      # Instead, use the /dev/serial/by-id/X serial device for your Z-Wave stick.
      - '/dev/serial/by-id/usb-Zooz_800_Z-Wave_Stick_533D004242-if00:/dev/zwave'
    volumes:
      - zwave-config:/usr/src/app/store
    # Or by using local folder
    # - ./store:/usr/src/app/store
    expose:
      - 8091 # port for web interface
      - 3000 # port for Z-Wave JS websocket server
    networks:
      - homeautomation

# meme-bot
  meme-bot:
    image: ropc/meme-bot:latest
    pull_policy: daily
    container_name: meme-bot
    volumes:
      - memebot:/code
    env_file:
      - ./memebot-prod.env
    restart: unless-stopped
    environment:
      REMINDERS_SAVE_FILE_PATH: /code/reminders.pickle
      WHISPER_CONFIG_FILE_PATH: /code/whisper_config.json
      OOC_CONFIG_FILE_PATH: /code/ooc_config.json
    networks:
      - meme-bot

  meme-bot-rust:
    build:
      context: .
      dockerfile: ./Dockerfile.rust
    image: ropc/meme-bot-rust:latest
    pull_policy: daily
    container_name: meme-bot-rust
    env_file:
      - ./memebot-prod.env
    restart: unless-stopped
    networks:
      - meme-bot

# minecraft
  minecraft:
    image: itzg/minecraft-server:stable
    pull_policy: daily
    container_name: minecraft
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      - "19132:19132/udp" # bedrock
    environment:
      EULA: TRUE
      TYPE: PAPER
      # MODPACK_PLATFORM: MODRINTH
      MODRINTH_PROJECTS: |
        viaversion
        # tcpshield
        # coreprotect
      PLUGINS: |
        # https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
        # https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://github.com/TCPShield/RealIP/releases/download/2.8.1/TCPShield-2.8.1.jar
    volumes:
      # attach the relative directory 'data' to the container's /data path
      - /docker/minecraft/server0:/data
      # - /docker/minecraft/plugins

# porn
  stash:
    image: ghcr.io/feederbox826/stash-s6:hwaccel
    pull_policy: daily
    container_name: stash
    restart: unless-stopped
    cpu_shares: 256   # default is 1024; smaller = lower priority
    ## the container's port must be the same with the STASH_PORT in the environment section
    gpus: all
    expose:
      - 9999
    networks:
      - stash
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=US/Eastern
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      ## Adjust below to change default port (9999)
      - STASH_PORT=9999
    volumes:
      ## Keep configs, scrapers, and plugins here.
      - /docker/stash/config:/root/.stash
      ## Point this at your collection.
      - /media/data/porn:/media/data/porn
      - /media/data/personal/porn:/media/data/personal/porn
      ## This is where your stash's metadata lives
      - /docker/stash/metadata:/metadata
      ## Any other cache content.
      - /docker/stash/cache:/cache
      ## Where to store binary blob data (scene covers, images)
      - /docker/stash/blobs:/blobs
      ## Where to store generated content (screenshots,previews,transcodes,sprites)
      - /docker/stash/generated:/generated
    # blkio_config:
    #   weight_device:
    #   - path: /dev/sdb
    #     weight: 250  # default 500; lower = lower priority

  qbittorrent-porn:
    image: lscr.io/linuxserver/qbittorrent:latest
    pull_policy: daily
    container_name: qbittorrent-porn
    cpu_shares: 128   # default is 1024; smaller = lower priority
    networks:
      - stash
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8666
      - TORRENTING_PORT=65124
      # - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - /docker/qbittorrent/porn-config:/config
      - /media/data/porn/torrents:/downloads
      - /docker/qbittorrent/vuetorrent:/vuetorrent
    expose:
      - 8666
    ports:
      - 65124:65124
      - 65124:65124/udp
    restart: unless-stopped
    # blkio_config:
    #   weight_device:
    #   - path: /dev/sdb
    #     weight: 125  # default 500; lower = lower priority


  # homepage

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    pull_policy: daily
    networks:
      - homepage
      - adguardhome
      - immich
    expose:
      - 3000
    volumes:
      - /docker/homepage/config:/app/config # Make sure your local config directory exists
      - /var/run/docker.sock:/var/run/docker.sock # (optional) For docker integrations
      - /media/data:/media/data:ro
      - /media/internal:/media/internal:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: oldlappy.home # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
      PUID: 1000
      PGID: 984

volumes:
  memebot:
  zwave-config:
    name: zwave-config
    external: true
  caddy_data:
  caddy_config:

networks:
  recyclarr:
    name: recyclarr
    # external: true

  # network groups, keeps containers isolated to their own groups
  # caddy also joins all of these in order to be able to serve through reverse proxy
  adguardhome:
    name: adguardhome
  immich:
    name: immich
    external: true
  homeautomation:
    name: homeautomation
  media:
    name: media
  meme-bot:
    name: meme-bot
  minecraft:
    name: minecraft
  stash:
    name: stash
  syncthing:
    name: syncthing
  nextcloud:
    name: nextcloud
    external: true
  homepage:
    name: homepage
