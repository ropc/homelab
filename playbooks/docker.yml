---
- name: setup docker
  hosts: myhosts
  tasks:
    - name: copy caddyfile
      ansible.builtin.copy:
        src: Caddyfile
        dest: /docker/caddy/conf/Caddyfile
        mode: "0644"

    - name: copy docker compose
      ansible.builtin.copy:
        src: ../docker-compose/
        dest: /ansible/docker-compose/
        mode: "0644"

    - name: create docker network
      community.docker.docker_network:
        name: caddy

    - name: create and start containers
      community.docker.docker_compose_v2:
        project_src: /ansible/docker-compose/
        state: present
        wait: true
        wait_timeout: 30
