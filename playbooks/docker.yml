---
- name: setup minecraft
  hosts: myhosts
  gather_facts: false
  tags: ["minecraft"]
  tasks:
    - name: copy compose file
      ansible.builtin.copy:
        src: "docker-compose.yml"
        dest: "/ansible/docker-compose/docker-compose.yml"
        mode: "0644"

    - name: create and start minecraft
      community.docker.docker_compose_v2:
        project_src: "/ansible/docker-compose/"
        services:
          - minecraft
        state: present
        wait: true
        wait_timeout: 60

- name: setup homeassistant
  hosts: myhosts
  gather_facts: false
  tags: ["homeassistant"]
  tasks:
    - name: copy compose file
      ansible.builtin.copy:
        src: "docker-compose.yml"
        dest: "/ansible/docker-compose/docker-compose.yml"
        mode: "0644"

    - name: create and start homeassistant
      community.docker.docker_compose_v2:
        project_src: "/ansible/docker-compose/"
        services:
          - homeassistant
        state: present
        wait: true
        wait_timeout: 60

- name: setup main containers
  hosts: myhosts
  gather_facts: false
  tasks:
    - name: create dirs
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: "ropc"
        group: "docker"
      loop:
        - /ansible/docker-compose/
        - /ansible/immich/
        - /ansible/nextcloud/
        - /tmp/incomplete-torrents

    - name: copy files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0644"
      loop:
        # main containers
        - { src: "Dockerfile.caddy", dest: "/ansible/docker-compose/Dockerfile.caddy" }
        - { src: "docker-compose.yml", dest: "/ansible/docker-compose/docker-compose.yml" }
        - { src: "memebot-prod.env", dest: "/ansible/docker-compose/memebot-prod.env" }
        # immich
        - { src: "docker-compose.immich.yml", dest: "/ansible/immich/docker-compose.yml" }
        - { src: "hwaccel.transcoding.yml", dest: "/ansible/immich/hwaccel.transcoding.yml" }
        - { src: "hwaccel.ml.yml", dest: "/ansible/immich/hwaccel.ml.yml" }
        - { src: "immich.env", dest: "/ansible/immich/.env" }
        # nextcloud
        - { src: "docker-compose.nextcloud.yml", dest: "/ansible/nextcloud/docker-compose.yml" }
        - { src: "nextcloud-db.env", dest: "/ansible/nextcloud/.env" }
        # homepage
        - { src: "homepage.docker.yml", dest: "/docker/homepage/config/docker.yaml" }
        - { src: "homepage.widgets.yml", dest: "/docker/homepage/config/widgets.yaml" }
        - { src: "homepage.settings.yml", dest: "/docker/homepage/config/settings.yaml" }

