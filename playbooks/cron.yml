---
- name: setup cron jobs
  hosts: myhosts
  tasks:
    - name: copy ofdl script
      ansible.builtin.copy:
        src: ofdl.sh
        dest: /ansible/ofdl.sh
        mode: "755"

    - name: setup cron job
      ansible.builtin.cron:
        name: "ofdl"
        minute: "0"
        hour: "5"
        job: "/ansible/ofdl.sh >> /ansible/ofdl.log 2>&1"
