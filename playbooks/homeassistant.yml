- name: update home assistant
  hosts: myhosts
  tasks:
    - name: get caddy container info
      community.docker.docker_container_info:
        name: caddy
      register: result

    - name: parse caddy container ip
      vars:
        json_query: "NetworkSettings.Networks.homeautomation.IPAddress"
      ansible.builtin.set_fact:
        caddy_container_ip: "{{ result.container | community.general.json_query(json_query) }}"

    - name: update config
      ansible.builtin.template:
        src: homeassistant-config.j2
        dest: /docker/homeassistant/configuration.yaml
        mode: "0644"

    - name: Call API to update config
      vars:
        homeassistant_api_key: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          32323963656435303262643236313036363938663537386532346135616166623234313931643632
