---
- name: update caddy
  hosts: myhosts
  tags:
    - setup-home-dns
    - setup-cloudflare-dns
  tasks:
    - name: set cloudflare api key across plays
      ansible.builtin.set_fact:
        cloudflare_api_key: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          66323239393863373933366566646332343532613335643064633163633231333562386662363633
          3564373630383335303263343333643535383865326337330a373732376664383663626133376166
          34373233666361333865363764643866613032376637616262653863333130366131396363636566
          3830303534313265650a386464373936333139353933353466663230346331643637323662396464
          30386438623136333332326636333231666531653733383561356464323437633132383665653061
          6233393439616562366136306164633230366231393236356230

    - name: update caddy related files on host
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0664"
      loop:
        - { src: "Dockerfile.caddy", dest: "/ansible/docker-compose/Dockerfile.caddy"}
        - { src: "docker-compose.yml", dest: "/ansible/docker-compose/docker-compose.yml"}

    - name: generate caddyfile
      ansible.builtin.template:
        src: caddyfile.j2
        dest: /docker/caddy/conf/Caddyfile
        mode: "0644"

    # - name: get latest base caddy images # will cause caddy to be rebuilt if a new one is found
    #   community.docker.docker_image_pull:
    #     name: "{{ item }}"
    #   loop:
    #     - caddy:latest
    #     - caddy:builder

    - name: run caddy container
      community.docker.docker_compose_v2:
        project_src: /ansible/docker-compose/
        services: ["caddy"]
        state: present
        wait: true
        wait_timeout: 30
      register: container

    - name: reload caddyfile
      # docker compose exec -w /etc/caddy caddy caddy reload
      community.docker.docker_compose_v2_exec:
        project_src: /ansible/docker-compose/
        service: caddy
        chdir: /etc/caddy
        command: caddy reload
      when: not container.changed

- name: read caddyfile
  hosts: myhosts
  tags:
    - never
    - setup-home-dns
    - setup-cloudflare-dns
  tasks:
    - name: read caddyfile to json
      # /bin/sh -c "caddy adapt --config /etc/caddy/Caddyfile 2>/dev/null"
      community.docker.docker_compose_v2_exec:
        project_src: /ansible/docker-compose/
        service: caddy
        chdir: /etc/caddy
        command: caddy adapt
      register: result

- name: setup .home domains on DNS
  hosts: myhosts
  tags:
    - never  # skips by default, run with `-K --tags "setup-home-dns"` to dns domains
    - setup-home-dns
  tasks:
    - name: stop adguard home
      community.docker.docker_compose_v2:
        project_src: /ansible/docker-compose/
        services: ["adguardhome"]
        state: stopped

    - name: update config
      become: true
      vars:
        json_query: "apps.http.servers.*.routes[].match[].host[?ends_with(@, '.home')][]"
        caddy_home_domains: "{{ result.stdout | ansible.builtin.from_json | community.general.json_query(json_query) | ansible.builtin.unique }}"
        # these can probably be taken from the public domains list
        home_domains: "{{ [ 'media.ropc.dev', 'photos.ropc.dev' ] + caddy_home_domains }}"
      ansible.builtin.template:
        src: AdGuardHome.j2
        dest: /docker/adguardhome/conf/AdGuardHome.yaml
        mode: "0600"

    - name: start adguard again
      community.docker.docker_compose_v2:
        project_src: /ansible/docker-compose/
        services: ["adguardhome"]
        state: present

- name: setup ropc.dev domains on Cloudflare
  hosts: myhosts
  tags:
    - never
    - setup-cloudflare-dns
  tasks:
    - name: parse ropc.dev domains from caddy json config
      vars:
        json_query: "apps.http.servers.*.routes[].match[].host[?ends_with(@, 'ropc.dev')][]"
      ansible.builtin.set_fact:
        caddy_public_domains: "{{ result.stdout | ansible.builtin.from_json | community.general.json_query(json_query) | ansible.builtin.unique }}"

    - name: get public ip
      community.general.ipify_facts:  # stores in ipify_public_ip

    - name: print
      ansible.builtin.debug:
        msg: "{{ caddy_public_domains }} {{ ipify_public_ip }}"

    - name: push domains to cloudflare
      community.general.cloudflare_dns:
        zone: ropc.dev
        record: "{{ item }}"
        type: A
        value: "{{ ipify_public_ip }}"
        proxied: true
        api_token: "{{ cloudflare_api_key }}"
      loop: "{{ caddy_public_domains }}"

