- name: setup docker
  hosts: myhosts
  tasks:
    - name: copy container configs
      ansible.builtin.copy:
        src: ./docker-configs/
        dest: /docker/

    - name: copy docker compose
      ansible.builtin.copy:
        src: ./docker-compose/
        dest: /ansible/docker-compose/

    - name: create docker network
      community.docker.docker_network:
        name: caddy
  
    - name: create and start containers
      community.docker.docker_compose_v2:
        project_src: /ansible/docker-compose/
        state: present
        wait: true
        wait_timeout: 30
