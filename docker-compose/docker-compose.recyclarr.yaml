networks:
  recyclarr:
    name: recyclarr
    external: true

services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr
    container_name: recyclarr
    # user: 1000:1000
    networks:
      - recyclarr
    volumes:
      - ~/.config/recyclarr:/config
    environment:
      - TZ=America/New_York
