# https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json

services:

# DNS Sinkhole
  adguardhome:
    image: 'adguard/adguardhome'
    container_name: 'adguardhome'
    cpu_shares: 2048   # default is 1024; larger = higher priority
    restart: unless-stopped
    networks:
      - caddy
    ports:
      - 53:53/tcp # DNS
      - 53:53/udp # DNS
      - 9980:80  # Web UI
      # - 3980:3000  # setup web ui
    volumes:
      - /docker/adguardhome/work:/opt/adguardhome/work
      - /docker/adguardhome/conf:/opt/adguardhome/conf

# reverse proxy
  # npm:
  #   image: 'jc21/nginx-proxy-manager:latest'
  #   container_name: npm
  #   restart: unless-stopped
  #   ports:
  #     # These ports are in format <host-port>:<container-port>
  #     - '80:80' # Public HTTP Port
  #     - '443:443' # Public HTTPS Port
  #     - '81:81' # Admin Web Port
  #     # Add any other Stream port you want to expose
  #     # - '21:21' # FTP
  #   environment:
  #     PUID: 1000
  #     PGID: 1000
  #     # Uncomment this if you want to change the location of
  #     # the SQLite DB file within the container
  #     # DB_SQLITE_FILE: "/data/database.sqlite"

  #     # Uncomment this if IPv6 is not enabled on your host
  #     # DISABLE_IPV6: 'true'
  #   volumes:
  #     - /docker/nginx-proxy-manager/data:/data
  #     - /docker/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
  #   networks:
  #     - caddy

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - caddy
    volumes:
      - /docker/caddy/conf:/etc/caddy
      - /docker/caddy/site:/srv
      - caddy_data:/data
      - caddy_config:/config

# simple static server
  static-site:
    image: nginx:alpine-slim
    container_name: static-site
    restart: unless-stopped
    ports:
      - 8000:80
    volumes:
      - /docker/static-site/html:/usr/share/nginx/html:ro
    networks:
      - caddy

# media
  
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - JELLYFIN_PublishedServerUrl=http://192.168.1.106 #optional
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /docker/jellyfin:/config
      - /media/data/piracy/media/shows:/data/tvshows
      - /media/data/piracy/media/movies:/data/movies
    ports:
      - 8096:8096
      # - 8920:8920 #optional
      - 7359:7359/udp #optional
      # - 1900:1900/udp #optional
    restart: unless-stopped
    networks:
      - caddy
      - cf-tunnel
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all

  # jellyseerr:
  #   image: ghcr.io/fallenbagel/jellyseerr:latest
  #   container_name: jellyseerr
  #   environment:
  #     - LOG_LEVEL=debug
  #     - TZ=America/New_York
  #     - PORT=5055 #optional
  #   ports:
  #     - 5055:5055
  #   volumes:
  #     - /docker/jellyseerr:/app/config
  #   restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /docker/sonarr:/config
      - /media/data/piracy:/data
    ports:
      - 8989:8989
    networks:
      - caddy
      - cf-tunnel
      - recyclarr
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /docker/radarr:/config
      - /media/data/piracy:/data
    ports:
      - 7878:7878
    networks:
      - caddy
      - cf-tunnel
      - recyclarr
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /docker/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    networks:
      - caddy

  # recyclarr:
  #   image: ghcr.io/recyclarr/recyclarr
  #   container_name: recyclarr
  #   # user: 1000:1000
  #   networks:
