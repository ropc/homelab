# meme-bot
  meme-bot:
    image: ropc/meme-bot:latest
    container_name: meme-bot
    volumes:
      - memebot:/code
    env_file:
      - ./memebot-prod.env
    restart: unless-stopped
    environment:
      REMINDERS_SAVE_FILE_PATH: /code/reminders.pickle
      WHISPER_CONFIG_FILE_PATH: /code/whisper_config.json
      OOC_CONFIG_FILE_PATH: /code/ooc_config.json

  meme-bot-rust:
    build:
      context: .
      dockerfile: ./Dockerfile.rust
    image: ropc/meme-bot-rust:latest
    container_name: meme-bot-rust
    env_file:
      - ./memebot-prod.env
    restart: unless-stopped

# minecraft
  crafty:
    container_name: crafty
    image: registry.gitlab.com/crafty-controller/crafty-4:latest
    restart: unless-stopped
    networks:
      - caddy
    environment:
      - TZ=America/New_York
    ports:
      - "8443:8443" # HTTPS
      # - "9123:8123" # DYNMAP
      - "19132:19132/udp" # BEDROCK
        #- "25500-25600:25500-25600" # MC SERV PORT RANGE
      - "25565:25565" # JAVA MC DEFAULT PORT
    volumes:
      - /docker/crafty/backups:/crafty/backups
      - /docker/crafty/logs:/crafty/logs
      - /docker/crafty/servers:/crafty/servers
      - /docker/crafty/config:/crafty/app/config
      - /docker/crafty/import:/crafty/import

# porn
  stash:
    image: stashapp/stash:latest
    container_name: stash
    restart: unless-stopped
    cpu_shares: 256   # default is 1024; smaller = lower priority
    ## the container's port must be the same with the STASH_PORT in the environment section
    ports:
      - "9999:9999"
    # networks:
    #   - local
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
    environment:
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      ## Adjust below to change default port (9999)
      - STASH_PORT=9999
    volumes:
      - /etc/localtime:/etc/localtime:ro
      ## Keep configs, scrapers, and plugins here.
      - /docker/stash/config:/root/.stash
      ## Point this at your collection.
      - /media/data/porn:/data/drive
      - /media/data/personal/porn:/data/personal
      ## This is where your stash's metadata lives
      - /docker/stash/metadata:/metadata
      ## Any other cache content.
      - /docker/stash/cache:/cache
      ## Where to store binary blob data (scene covers, images)
      - /docker/stash/blobs:/blobs
      ## Where to store generated content (screenshots,previews,transcodes,sprites)
      - /docker/stash/generated:/generated
    devices:
      - /dev/dri:/dev/dri
    blkio_config:
      weight_device:
      - path: /dev/sdb
        weight: 250  # default 500; lower = lower priority

  qbittorrent-porn:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent-porn
    cpu_shares: 128   # default is 1024; smaller = lower priority
    # networks:
    #   - local
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8666
      - TORRENTING_PORT=65124
      # - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - /docker/qbittorrent/porn-config:/config
      - /media/data/porn/torrents:/downloads
      - /docker/qbittorrent/vuetorrent:/vuetorrent
    ports:
      - 8666:8666
      - 65124:65124
      - 65124:65124/udp
    restart: unless-stopped
    blkio_config:
      weight_device:
      - path: /dev/sdb
        weight: 125  # default 500; lower = lower priority

# syncthing
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    hostname: syncthing #optional
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /docker/syncthing/config:/config
      - /media/data/personal:/data
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    restart: unless-stopped

volumes:
  memebot:
  zwave-config:
    name: zwave-config
    external: true
  caddy_data:
  caddy_config:

networks:
  cf-tunnel:
    name: cf-tunnel
    external: true
  recyclarr:
    name: recyclarr
    # external: true
  home-automation:
    name: home-automation
  caddy:
    name: caddy
    external: true

