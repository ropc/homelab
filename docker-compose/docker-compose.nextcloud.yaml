services:
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    container_name: nextcloud
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /docker/nextcloud/config:/config
      - /media/drive/nextcloud:/data
    ports:
      - 9443:443
    restart: unless-stopped